name: Uppdatera röstdata

on:
  schedule:
    - cron: "17 3 * * *"   # varje natt, 03:17 UTC
  workflow_dispatch:        # gör att du kan köra manuellt

permissions:
  contents: write

jobs:
  uppdatera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hämta data från riksdagen
        run: python fetch_data.py

      - name: Committa om data ändrats
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m "Uppdatera röstdata"
            git push
          fi
